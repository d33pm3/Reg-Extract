[project]
name = "regextractor"
version = "1.3.0"
description = "Deterministic two-stage regulatory clause extractor"
requires-python = ">=3.10"
authors = [{ name = "DK Mendiratta" }]
dependencies = [
  "pydantic>=2.0",
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ocr = ["pytesseract>=0.3", "pdf2image>=1.16"]
docling = ["docling>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
regextractor = "regextractor.cli:main"
