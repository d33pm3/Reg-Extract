name: RegExtractor CI and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock
      - name: Fail if tests cannot be collected
        run: PYTHONPATH=src:. pytest --collect-only -q
      - name: Tests
        run: PYTHONPATH=src:. pytest -q --tb=short
      - name: Build release
        run: |
          python scripts/make_release.py
          ls -la dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RegExtractor-1.3.0
          path: dist/*
          if-no-files-found: error
